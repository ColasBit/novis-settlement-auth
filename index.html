<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Fight — Site Officiel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="assets\images\dessin6.png">

    <!-- Chargement modulaire respectant l'ordre des dépendances -->
    <script src="js/data.js" defer></script>
    <script src="js/store.js" defer></script>
    <script src="js/services.js" defer></script>
    <script src="js/views.js" defer></script>
    <script src="js/controller.js" defer></script>
</head>
<body>
    <!-- Cadre décoratif inspiré du tapis de souris -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <header class="site-header">
        <div class="logo-wrapper" data-nav="home" title="Retour à l'accueil">
            <img 
                src="assets/images/logo-inline.png" 
                alt="The Ultimate Fight" 
                class="header-logo-img"
            >
        </div>
        <nav class="main-nav" id="main-nav">
            <button class="nav-btn active" data-nav="home">01. Accueil</button>
            <button class="nav-btn" data-nav="manifesto">02. Le Manifeste</button>
            <button class="nav-btn" data-nav="lore">03. Archives Impériales</button>
            <button class="nav-btn nav-vip" data-nav="vip">04. Zone Restreinte</button>
            <button class="nav-btn" data-nav="shop">05. Boutique</button>
        </nav>
    </header>

    <!-- Point de montage unique piloté par la Vue -->
    <main id="app-view" class="app-container"></main>

    <footer class="site-footer">
        <p>© 2026 Nicolas ZAGO — <strong>The Ultimate Fight</strong> (ISBN 979-10-987949-0-2)</p>
        <p class="footer-sub">Création Indépendante : Nicolas ZAGO • Illustrations : Atelier Hibiki • Animation : Numanne • Voix Doublage : Jean François</p>
    </footer>

</html>
